name: Merge M3U Playlists

on:
  push:
    paths:
      - 'rotana'
      - 'shahid'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Merge playlists
        run: |
          echo "#EXTM3U" > all.m3u
          echo "" >> all.m3u
          grep -v "^#EXTM3U" rotana >> all.m3u || true
          echo "" >> all.m3u
          grep -v "^#EXTM3U" shahid >> all.m3u || true

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add all.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-merge playlists"
          git push